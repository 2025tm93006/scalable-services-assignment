openapi: 3.0.3
info:
  title: Quarantine Service API
  version: 1.0.0
  description: >
    Quarantine owns the quarantine record and its state machine. It is the only
    service that calls out over REST: a scan claims one scanner capacity slot, asks
    Scanner with connect and read timeouts, retries with exponential backoff plus
    jitter, and stores Scanner's verdict. A record settles once and is never
    transitioned again, and a Scanner that stays unreachable settles the file as
    FAILED instead of leaving the caller with a half-run scan. Its own record is the
    authoritative answer for Release, which reads a file by fileId instead of trusting
    the state a client claims.
servers:
  - url: http://localhost:8082
paths:
  /api/v1/quarantine:
    post:
      summary: Create a quarantine record
      description: >
        fileId is the operation identity. A repeat for a file that already has a
        record conflicts, and so does the losing request of two simultaneous
        creations of the same file: the unique fileId index decides the winner and
        the loser is reported as the same 409 a sequential repeat gets.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuarantineRequest'
      responses:
        '201':
          description: Quarantine record created
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantineResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409':
          description: File already has a quarantine record, including a lost creation race
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/quarantine/{id}/scan:
    post:
      summary: Scan a quarantined file
      description: >
        Moves the record to SCANNING, calls Scanner and settles it as CLEAN,
        INFECTED or FAILED. Returns 409 when the record has already settled, when a
        scan of it is already in flight, or when every scanner capacity slot is held
        by another scan; a refused scan leaves the record QUARANTINED and retryable.
      parameters:
        - $ref: '#/components/parameters/QuarantineId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Scan settled; the state is Scanner's verdict or FAILED
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantineResponse'
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Three distinct refusals share this status and are told apart by the
            message: the record has already settled, a scan of it is already in
            flight, or scanner capacity is exhausted.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/quarantine/_evidence/summary:
    get:
      summary: Summarize quarantine records by state and report the scanner capacity
      responses:
        '200':
          description: Quarantine record counts and slot allocation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantineEvidence'
  /api/v1/quarantine/{id}:
    get:
      summary: Get a quarantine record
      parameters:
        - $ref: '#/components/parameters/QuarantineId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Quarantine record
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantineResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/quarantine/by-file/{fileId}:
    get:
      summary: Get the quarantine record for a file, addressed by Intake's id
      description: >
        The authoritative state of one file for another service. Release calls this before
        granting a release, so a caller cannot get a file released by claiming it is CLEAN.
        404 means the file was never quarantined.
      parameters:
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The quarantine record for this file
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantineResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /health:
    get:
      summary: Check service liveness
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: UP }
                  service: { type: string }
                  timestamp: { type: string, format: date-time }
components:
  parameters:
    QuarantineId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Intake's file identifier, the only id that crosses service boundaries.
    CorrelationId:
      in: header
      name: X-Correlation-Id
      required: false
      schema:
        type: string
      description: >
        Caller-supplied correlation ID, generated when absent and forwarded to
        Scanner on the scan call.
  headers:
    CorrelationId:
      description: Request correlation ID, returned on all responses.
      schema:
        type: string
  responses:
    BadRequest:
      description: >
        Validation failure: fileId is not a UUID, scannerMode is outside
        CLEAN, INFECTED, FAIL or SLOW, or the body is malformed JSON.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: No quarantine record exists for the supplied identifier.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    MethodNotAllowed:
      description: The path exists but the HTTP method does not.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    UnsupportedMediaType:
      description: The request body is not application/json.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    InternalError:
      description: Unexpected failure; the details are in the log, not the body.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      description: The one error body every service returns, from the shared handler.
      required: [timestamp, status, error, message, path, correlationId, fieldErrors]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }
        correlationId: { type: string }
        fieldErrors:
          type: object
          additionalProperties: { type: string }
    QuarantineRequest:
      type: object
      required: [fileId, scannerMode]
      properties:
        fileId:
          type: string
          format: uuid
        scannerMode:
          type: string
          enum: [CLEAN, INFECTED, FAIL, SLOW]
    QuarantineResponse:
      type: object
      required: [id, fileId, state, scannerMode, quarantinedAt]
      properties:
        id:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
        state:
          type: string
          enum: [QUARANTINED, SCANNING, CLEAN, INFECTED, FAILED]
          description: >
            SCANNING is only observable while the Scanner call is in flight; the
            other four are the states a record can be left in.
        scannerMode:
          type: string
        quarantinedAt:
          type: string
          format: date-time
        scannedAt:
          type: string
          format: date-time
          nullable: true
    QuarantineEvidence:
      type: object
      required: [total, byState, scannerSlots, capacity]
      properties:
        total:
          type: integer
          format: int64
        byState:
          type: object
          additionalProperties:
            type: integer
            format: int64
        scannerSlots:
          type: object
          description: Rows of the capacity table by status, the contended resource.
          properties:
            FREE:
              type: integer
              format: int64
            HELD:
              type: integer
              format: int64
        capacity:
          type: integer
          description: MAX_CONCURRENT_SCANS, the number of scans allowed at once.
