openapi: 3.0.3
info:
  title: Release Service Scaffold API
  version: 0.1.0
servers:
  - url: http://localhost:8084
paths:
  /health:
    get:
      summary: Check service liveness
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: UP }
                  service: { type: string }
                  timestamp: { type: string, format: date-time }
