openapi: 3.0.3
info:
  title: Release Service API
  version: 1.0.0
  description: >
    Release grants the terminal release of a file that Quarantine reports as CLEAN.
    The caller's quarantineState is only a claim: Release reads the file's own
    quarantine record from Quarantine over REST and refuses a release that claim
    contradicts, so a client cannot release a file by asserting it is clean. Each
    service owns its own database and no service reads another's.
  x-dependencies:
    - Quarantine GET /api/v1/quarantine/by-file/{fileId} (read-only verification)
servers:
  - url: http://localhost:8084
paths:
  /health:
    get:
      summary: Check service liveness
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: UP }
                  service: { type: string, example: release-service }
                  timestamp: { type: string, format: date-time }
  /api/v1/releases:
    post:
      summary: Release a clean quarantined file
      description: >
        Idempotent on fileId. A repeat request returns the original release
        record with status 201 and never creates a second row, and it needs no
        call to Quarantine: a finished release is answered from Release's own
        table, so a Quarantine outage cannot unmake a file that is already out.
        A file that has not been released is checked in two stages - first the
        claim (quarantineState must be exactly CLEAN and quarantinedAt present),
        then the authoritative record read from Quarantine, whose state and
        quarantinedAt must match what was claimed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseRequest'
            examples:
              clean:
                summary: Releasable file
                value:
                  fileId: 3f2a4e6c-1b2d-4c5e-8f90-123456789abc
                  quarantineState: CLEAN
                  quarantinedAt: '2026-10-24T08:00:00Z'
              missingTimestamp:
                summary: Quarantined but no timestamp, rejected with 409
                value:
                  fileId: 3f2a4e6c-1b2d-4c5e-8f90-123456789abc
                  quarantineState: CLEAN
      responses:
        '201':
          description: Released, or the original release record replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseResponse'
        '400':
          description: Malformed JSON, missing fileId, blank or oversized state, invalid UUID or timestamp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: >
            The claim is not CLEAN or has no timestamp, Quarantine has no record of
            this file, Quarantine reports a state other than CLEAN, or the claimed
            quarantinedAt does not match the quarantine record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: Request body is not JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: >
            Quarantine did not answer within the retry budget. The release is refused
            rather than granted on the caller's word, and repeating it later may succeed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/releases/{id}:
    get:
      summary: Read a release record
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Release record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseResponse'
        '400':
          description: Path value is not a UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: File has not been released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ReleaseRequest:
      type: object
      required: [fileId, quarantineState]
      properties:
        fileId:
          type: string
          format: uuid
        quarantineState:
          type: string
          maxLength: 32
          description: Compared exactly with CLEAN; other values are a business conflict.
        quarantinedAt:
          type: string
          format: date-time
          nullable: true
          description: Omit or send null to be rejected with 409 rather than 400.
    ReleaseResponse:
      type: object
      properties:
        fileId: { type: string, format: uuid }
        state: { type: string, example: RELEASED }
        quarantinedAt: { type: string, format: date-time }
        releasedAt: { type: string, format: date-time }
    ApiError:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }
        correlationId: { type: string }
        fieldErrors:
          type: object
          additionalProperties: { type: string }
