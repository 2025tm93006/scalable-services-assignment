<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><rect width="1600" height="1040" fill="white"/><rect x="30" y="20" width="730" height="420" rx="12" fill="#f5f7f9" stroke="#78848f" stroke-width="2"/><text x="395" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#181818">Intake database - file-based H2</text><text x="56" y="118" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#181818">FILE_RECORD</text><text x="56" y="157" font-family="Arial,sans-serif" font-size="27"  fill="#181818">id  PK UUID</text><text x="56" y="196" font-family="Arial,sans-serif" font-size="27"  fill="#181818">idempotency_key  UNIQUE NOT NULL</text><text x="56" y="235" font-family="Arial,sans-serif" font-size="27"  fill="#181818">fingerprint  SHA-256</text><text x="56" y="274" font-family="Arial,sans-serif" font-size="27"  fill="#181818">filename, contentType, sizeBytes</text><text x="56" y="313" font-family="Arial,sans-serif" font-size="27"  fill="#181818">sha256, scannerMode, status, createdAt</text><text x="56" y="352" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#181818">responseBody  original JSON response</text><rect x="840" y="20" width="730" height="420" rx="12" fill="#f5f7f9" stroke="#78848f" stroke-width="2"/><text x="1205" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#181818">Scanner database - reference</text><text x="866" y="118" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#181818">SCAN_ATTEMPT</text><text x="866" y="157" font-family="Arial,sans-serif" font-size="27"  fill="#181818">id  PK generated Long</text><text x="866" y="196" font-family="Arial,sans-serif" font-size="27"  fill="#181818">fileId  UNIQUE UUID</text><text x="866" y="235" font-family="Arial,sans-serif" font-size="27"  fill="#181818">mode, result</text><text x="866" y="274" font-family="Arial,sans-serif" font-size="27"  fill="#181818">startedAt, finishedAt</text><rect x="30" y="510" width="730" height="500" rx="12" fill="#f5f7f9" stroke="#78848f" stroke-width="2"/><text x="395" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#181818">Quarantine database - reference</text><text x="56" y="608" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#181818">QUARANTINE_RECORD</text><text x="56" y="647" font-family="Arial,sans-serif" font-size="27"  fill="#181818">fileId  PK UUID</text><text x="56" y="686" font-family="Arial,sans-serif" font-size="27"  fill="#181818">state, scannerMode</text><text x="56" y="725" font-family="Arial,sans-serif" font-size="27"  fill="#181818">quarantinedAt, updatedAt</text><text x="56" y="764" font-family="Arial,sans-serif" font-size="27"  fill="#181818"></text><text x="56" y="803" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#181818">SCAN_SLOT</text><text x="56" y="842" font-family="Arial,sans-serif" font-size="27"  fill="#181818">id  PK generated Long</text><text x="56" y="881" font-family="Arial,sans-serif" font-size="27"  fill="#181818">fileId, status, startedAt, finishedAt</text><rect x="840" y="510" width="730" height="500" rx="12" fill="#f5f7f9" stroke="#78848f" stroke-width="2"/><text x="1205" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#181818">Release database - reference</text><text x="866" y="608" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#181818">RELEASE_RECORD</text><text x="866" y="647" font-family="Arial,sans-serif" font-size="27"  fill="#181818">fileId  PK UUID</text><text x="866" y="686" font-family="Arial,sans-serif" font-size="27"  fill="#181818">releasedAt</text><text x="866" y="725" font-family="Arial,sans-serif" font-size="27"  fill="#181818"></text><text x="866" y="764" font-family="Arial,sans-serif" font-size="27"  fill="#181818">References use UUID values only</text><text x="866" y="803" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#181818">No cross-database foreign keys</text></svg>