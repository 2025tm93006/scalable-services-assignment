server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: release-service
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/release}
    username: ${DB_USERNAME:release_user}
    password: ${DB_PASSWORD:release_local_demo}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
quarantine:
  # Release asks Quarantine what the state really is instead of trusting the caller.
  base-url: ${QUARANTINE_BASE_URL:http://localhost:8082}
  connect-timeout-millis: ${QUARANTINE_CONNECT_TIMEOUT_MILLIS:300}
  read-timeout-millis: ${QUARANTINE_READ_TIMEOUT_MILLIS:2000}
  max-attempts: ${QUARANTINE_MAX_ATTEMPTS:3}
  # Delay is retry-base * 2^(attempt-1) plus a random 0..retry-jitter milliseconds.
  retry-base-millis: ${QUARANTINE_RETRY_BASE_MILLIS:100}
  retry-jitter-millis: ${QUARANTINE_RETRY_JITTER_MILLIS:100}
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] %logger{36} - %msg%n"
