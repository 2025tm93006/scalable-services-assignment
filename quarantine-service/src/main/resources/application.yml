server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: quarantine-service
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/quarantine}
    username: ${DB_USERNAME:quarantine_user}
    password: ${DB_PASSWORD:quarantine_local_demo}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
quarantine:
  # Scanner capacity. A scan only runs while it owns one of these slots.
  max-concurrent-scans: ${MAX_CONCURRENT_SCANS:2}
  # Reclaim sweep: a HELD slot and a SCANNING record older than this are treated as
  # abandoned by a process that stopped. Keep it above read-timeout x max-attempts or
  # the sweep can interrupt a scan that is still entitled to finish.
  slot-stale-millis: ${QUARANTINE_SLOT_STALE_MILLIS:60000}
  reclaim-interval-millis: ${QUARANTINE_RECLAIM_INTERVAL_MILLIS:10000}
  reclaim-enabled: ${QUARANTINE_RECLAIM_ENABLED:true}
scanner:
  base-url: ${SCANNER_BASE_URL:http://localhost:8083}
  connect-timeout-millis: ${SCANNER_CONNECT_TIMEOUT_MILLIS:300}
  # Above this the call is treated as a failed attempt and retried with backoff.
  read-timeout-millis: ${SCANNER_READ_TIMEOUT_MILLIS:5000}
  max-attempts: ${SCANNER_MAX_ATTEMPTS:3}
  # Delay is retry-base * 2^(attempt-1) plus a random 0..retry-jitter milliseconds.
  retry-base-millis: ${SCANNER_RETRY_BASE_MILLIS:100}
  retry-jitter-millis: ${SCANNER_RETRY_JITTER_MILLIS:100}
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] %logger{36} - %msg%n"
