server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: intake-service
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/intake}
    username: ${DB_USERNAME:intake_user}
    password: ${DB_PASSWORD:intake_local_demo}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] %logger{36} - %msg%n"
